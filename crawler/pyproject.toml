[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler"
version = "0.1.0"
description = "A small command-line web crawler backed by MySQL"
requires-python = ">=3.10"
dependencies = ["PyMySQL>=1.1,<2"]
license = {text = "MIT"}
authors = [{name = "Crawler contributors"}]

[project.scripts]
crawler = "crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
